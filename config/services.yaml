# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  logos_directory: '%kernel.project_dir%/public/uploads/logos'
  rawg_api_key: '%env(default::RAWG_API_KEY)%'
  rawg_allow_insecure_ssl: '%env(bool:RAWG_ALLOW_INSECURE_SSL)%'
  gemini_api_key: '%env(default::GEMINI_API_KEY)%'
  gemini_model: 'models/gemini-pro'
  jwt_secret: '%env(JWT_SECRET)%'
  mailer.smtp_host: '%env(MAILER_SMTP_HOST)%'
  mailer.smtp_port: '%env(int:MAILER_SMTP_PORT)%'
  mailer.smtp_username: '%env(MAILER_SMTP_USERNAME)%'
  mailer.smtp_password: '%env(MAILER_SMTP_PASSWORD)%'
  mailer.from_email: '%env(MAILER_FROM_EMAIL)%'
  mailer.from_name: '%env(MAILER_FROM_NAME)%'
  mailer.smtp_encryption: '%env(bool:MAILER_SMTP_ENCRYPTION)%'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\Service\StripeService:
    arguments:
      $stripeApiKey: '%env(STRIPE_SECRET_KEY)%'
  App\Service\EmailService:
    arguments:
      $fromEmail: '%env(FROM_EMAIL)%'
      $apiKey: '%env(SENDGRID_API_KEY)%'
  App\Service\JwtService:
    arguments:
      $jwtSecret: '%jwt_secret%'
  App\Service\MailerService:
    arguments:
      $smtpHost: '%mailer.smtp_host%'
      $smtpPort: '%mailer.smtp_port%'
      $smtpUsername: '%mailer.smtp_username%'
      $smtpPassword: '%mailer.smtp_password%'
      $fromEmail: '%mailer.from_email%'
      $fromName: '%mailer.from_name%'
      $smtpEncryption: '%mailer.smtp_encryption%'
  App\Service\ChatbotService: ~
  App\Service\PasswordResetService: ~

  # Tournament services - will be added when copying tournament module files
  # App\Service\GeminiRegistrationReviewService:
  #   arguments:
  #     $apiKey: '%gemini_api_key%'
  #     $model: '%gemini_model%'

  # App\Service\NotificationService: ~

  # App\Service\PdfGenerator: ~
  # App\Service\AIPricingService:
  #   arguments:
  #     $groqApiKey: '%env(GROQ_API_KEY)%'
  App\Service\AIRewardAnalysisService:
    arguments:
      $groqApiKey: '%env(GROQ_API_KEY)%'
